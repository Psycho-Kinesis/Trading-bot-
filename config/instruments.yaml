      - {from: "2024-11-20", value: 15}
      - {from: "2025-01-01", value: 35}
    # Weekly BANKNIFTY contracts were withdrawn in the Nov-2024 rationalisation.
    weekly_expiry:
      - {from: "2016-05-27", weekday: 3}   # Thursday
      - {from: "2023-09-06", weekday: 2}   # Wednesday
      - {from: "2024-11-20", weekday: null}  # weeklies discontinued
    monthly_expiry:
      - {from: "2005-06-13", weekday: 3}
      - {from: "2025-09-01", weekday: 1}

