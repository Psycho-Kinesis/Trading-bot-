# ---------------------------------------------------------------------------
# Contract specifications for Indian index derivatives.
#
# READ THIS BEFORE TRUSTING THE NUMBERS BELOW.
#
# Lot sizes and expiry weekdays are set by exchange circular and HAVE changed
# several times (Nov-2024 lot size revision, the 2025 expiry-day
# rationalisation, the Nov-2024 withdrawal of most weekly contracts).  Every
# rule here is therefore stamped with the date it took effect, so a backtest
# over 2023 uses 2023's rules and not today's.
#
# The values are accurate to the best of the author's knowledge as of the
# `verified_on` date.  They are NOT fetched live.  Run
# `quantsutra verify-specs` to diff them against the exchange, and update this
# file when a circular lands.  If a lot size here is stale your position sizing
# will be wrong by a whole multiple -- treat this file as a config you own.
# ---------------------------------------------------------------------------
verified_on: "2025-09-01"

instruments:
  NIFTY:
    name: "Nifty 50"
    exchange: NSE
    segment: INDEX_FNO
    strike_step: 50
    yahoo: "^NSEI"
    nse_symbol: "NIFTY"
    # Lot size history: each entry applies from `from` until the next entry.
    lot_size:
      - {from: "2015-01-01", value: 75}
      - {from: "2018-01-01", value: 75}
      - {from: "2020-01-01", value: 75}
      - {from: "2021-01-01", value: 50}
      - {from: "2022-01-01", value: 50}
      - {from: "2024-11-20", value: 25}
      - {from: "2025-01-01", value: 75}
    # Weekly expiry weekday (0=Mon .. 6=Sun); null means no weekly contract.
    weekly_expiry:
      - {from: "2019-02-11", weekday: 3}   # Thursday
      - {from: "2025-09-01", weekday: 1}   # Tuesday (NSE expiry-day rationalisation)
    monthly_expiry:
      - {from: "2001-06-04", weekday: 3}   # last Thursday of the month
      - {from: "2025-09-01", weekday: 1}   # last Tuesday of the month

  BANKNIFTY:
