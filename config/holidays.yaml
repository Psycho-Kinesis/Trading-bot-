# NSE/BSE trading holidays (equity + F&O segment).
#
# Exchanges publish these annually, usually in December for the following year.
# The lists below are best-effort and MUST be refreshed each year -- an out of
# date list silently shifts every expiry calculation that lands near a holiday.
# `quantsutra calendar --check` reports how stale this file is.
#
# `provisional: true` marks a year whose list was not confirmed against an
# exchange circular; the calendar will warn when it uses one.

2023:
  provisional: false
  dates:
    - {date: "2023-01-26", name: "Republic Day"}
    - {date: "2023-03-07", name: "Holi"}
    - {date: "2023-03-30", name: "Ram Navami"}
    - {date: "2023-04-04", name: "Mahavir Jayanti"}
    - {date: "2023-04-07", name: "Good Friday"}
    - {date: "2023-04-14", name: "Dr. Ambedkar Jayanti"}
    - {date: "2023-05-01", name: "Maharashtra Day"}
    - {date: "2023-06-28", name: "Bakri Id"}
    - {date: "2023-08-15", name: "Independence Day"}
    - {date: "2023-09-19", name: "Ganesh Chaturthi"}
    - {date: "2023-10-02", name: "Mahatma Gandhi Jayanti"}
    - {date: "2023-10-24", name: "Dussehra"}
    - {date: "2023-11-14", name: "Diwali Balipratipada"}
    - {date: "2023-11-27", name: "Gurunanak Jayanti"}
    - {date: "2023-12-25", name: "Christmas"}

