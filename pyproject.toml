[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsutra"
version = "0.1.0"
description = "A rule-based analysis and signal engine for Indian equity indices and their F&O contracts (NIFTY, BANKNIFTY, SENSEX)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.28",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
quantsutra = "quantsutra.cli:cli"

[tool.setuptools.packages.find]
include = ["quantsutra*"]

[tool.setuptools.package-data]
quantsutra = ["../config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = ["slow: full backtest runs; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py310"
